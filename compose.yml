services:

  sqrzl:
    container_name: sqrzl
    hostname: sqrzl
    image: ghcr.io/sqrzl/sqrzl-emulator:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      SQRZL_BLOBS_PATH: /app/blobs
      SQRZL_ACCESS_KEY_ID: admin
      SQRZL_SECRET_ACCESS_KEY: easy-peasy
    volumes:
      - sqrzl-blobs:/app/blobs

volumes:
  sqrzl-blobs:
