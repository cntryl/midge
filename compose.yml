services:

  peas:
    container_name: peas
    hostname: peas
    image: ghcr.io/sqrzl/peas-emulator:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      BLOBS_PATH: /app/blobs
      ACCESS_KEY_ID: admin
      SECRET_ACCESS_KEY: easy-peasy
    volumes:
      - peas-blobs:/app/blobs

volumes:
  peas-blobs: