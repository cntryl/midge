[package]
name = "cntryl-midge-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
readme = "README.md"

# Keep cargo-fuzz and its targets in a separate workspace from the release crates.
[workspace]

[package.metadata]
cargo-fuzz = true

# engine_differential path-includes crates/midge/tests/support/differential.rs, which uses bytes.
[package.metadata.cargo-machete]
ignored = ["bytes"]

[dependencies]
bytes = "1.12"
cntryl-midge = { path = "../crates/midge", features = ["internal-testing"] }
libfuzzer-sys = "0.4"
tempfile = "3.27"

[[bin]]
name = "wal_frame_recovery"
path = "fuzz_targets/wal_frame_recovery.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_journal_replay"
path = "fuzz_targets/manifest_journal_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intent_log_replay"
path = "fuzz_targets/intent_log_replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sst_block_decode"
path = "fuzz_targets/sst_block_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sst_data_block_decode"
path = "fuzz_targets/sst_data_block_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sst_index_decode"
path = "fuzz_targets/sst_index_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sst_filter_decode"
path = "fuzz_targets/sst_filter_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_differential"
path = "fuzz_targets/engine_differential.rs"
test = false
doc = false
bench = false
