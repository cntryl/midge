[package]
name = "cntryl-midge-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider-neutral object storage for Midge"
license.workspace = true
repository.workspace = true
autobenches = false

[lib]
bench = false

[dependencies]
cntryl-midge-core.workspace = true
bytes = { version = "1.12", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam = "0.8"
crc32c = "0.6"
fail = { version = "0.5", features = ["failpoints"], optional = true }
hex = "0.4"
hmac = { version = "0.13", optional = true }
libc = "0.2"
md5 = { package = "md-5", version = "0.11", optional = true }
parking_lot = "0.13"
percent-encoding = { version = "2.3", optional = true }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"], optional = true }
ring = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.11", optional = true }
sha2 = "0.11"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"], optional = true }
url = "2.5"
urlencoding = { version = "2.1", optional = true }
uuid = { version = "1.29", features = ["v4"] }

[features]
default = ["cloud-all"]
internal-testing = ["cntryl-midge-core/internal-testing"]
sqrzl-tests = ["cloud-signing", "dep:sha1"]
failpoints = ["cntryl-midge-core/failpoints", "dep:fail"]
cloud-common = ["dep:reqwest", "dep:tokio"]
cloud-signing = ["cloud-common", "dep:base64", "dep:hmac", "dep:percent-encoding", "dep:urlencoding"]
cloud-aws = ["cloud-signing"]
cloud-azure = ["cloud-signing", "dep:md5"]
cloud-gcp = ["cloud-signing", "dep:ring", "dep:sha1"]
cloud-oci = ["cloud-signing"]
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci"]

[dependencies.base64]
version = "0.23"
optional = true

[dev-dependencies]
cntryl-midge-storage = { path = ".", default-features = false, features = ["internal-testing"] }
tempfile = "3.27"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
