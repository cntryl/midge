[package]
name = "cntryl-midge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A high-performance embedded key-value database with LSM-tree storage"
license.workspace = true
repository.workspace = true
autobenches = false
readme = "README.md"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["database-implementations"]

[lib]
bench = false

[[bin]]
name = "midge"
bench = false

[dependencies]
cntryl-midge-core.workspace = true
cntryl-midge-durability.workspace = true
cntryl-midge-storage.workspace = true
cntryl-midge-table.workspace = true

arc-swap.workspace = true
bytes.workspace = true
chrono.workspace = true
crc32c.workspace = true
crossbeam.workspace = true
dashmap.workspace = true
fail = { workspace = true, optional = true }
hex.workspace = true
# Optional global allocator; see `docs/operations/performance-tuning.md`
mimalloc = { version = "0.1", optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = "0.40"
tempfile.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi.workspace = true

[dev-dependencies]
base64.workspace = true
cntryl-stress.workspace = true
crc32fast = "1.5"
hdrhistogram = "7.6"
hmac.workspace = true
md5.workspace = true
num_cpus = "1.17"
proptest.workspace = true
rand.workspace = true
reqwest.workspace = true
rmp-serde.workspace = true
sha1.workspace = true
tracing-subscriber.workspace = true
xxhash-rust.workspace = true
# Self dev-dependency: turns on `internal-testing` for tests/ and benches/ so
# they can reach implementation internals through `cntryl_midge::__internal`
# without those modules being public API for downstream consumers.
cntryl-midge = { path = ".", default-features = false, features = ["internal-testing"] }

[features]
default = ["cloud-all"]
failpoints = [
    "dep:fail",
    "cntryl-midge-core/failpoints",
    "cntryl-midge-table/failpoints",
    "cntryl-midge-storage/failpoints",
    "cntryl-midge-durability/failpoints",
]
# Installs mimalloc as the global allocator of the `midge` binary. The library
# never installs an allocator; embedding applications choose their own.
alloc-mimalloc = ["dep:mimalloc"]
telemetry = ["cloud-common", "cntryl-midge-core/telemetry"]
telemetry-otlp = ["telemetry", "cntryl-midge-core/telemetry-otlp"]

# Cloud storage backends, enabled by default for current deployment profiles.
cloud-common = ["cntryl-midge-storage/cloud-common", "cntryl-midge-durability/cloud-common"]
# Request signing shared by every provider. Not a backend by itself.
cloud-signing = ["cloud-common", "cntryl-midge-storage/cloud-signing"]
cloud-aws = ["cloud-signing", "cntryl-midge-storage/cloud-aws"]
cloud-azure = ["cloud-signing", "cntryl-midge-storage/cloud-azure"]
cloud-gcp = ["cloud-signing", "cntryl-midge-storage/cloud-gcp"]
cloud-oci = ["cloud-signing", "cntryl-midge-storage/cloud-oci"]
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci", "cntryl-midge-durability/cloud-all"]

# Test and benchmark only. Never enable these from a downstream crate.
# Exposes `cntryl_midge::__internal` for this crate's own tests, benches and
# fuzz targets; nothing behind it is stable API.
internal-testing = [
    "cntryl-midge-core/internal-testing",
    "cntryl-midge-table/internal-testing",
    "cntryl-midge-storage/internal-testing",
    "cntryl-midge-durability/internal-testing",
]
sqrzl-tests = ["cntryl-midge-storage/sqrzl-tests"]
stress-soak = ["cloud-all"]
checkpoint-bench = ["internal-testing"]
# Enables the #908 admission configuration in the Tier 4 compaction
# backpressure benchmark; without it the row runs with hard stalls only.
candidate-write-backpressure-bench = []

# Fault injection is run explicitly and serially because failpoints are
# process-global. Broad test selections must not run this target.
[[test]]
name = "fault_injection"
test = false
required-features = ["failpoints"]

# Exploratory measurement example; not a public engine configuration surface.
[[example]]
name = "benchmark_investigation"
required-features = ["internal-testing"]

[[example]]
name = "checkpoint_campaign_readback"
required-features = ["internal-testing"]

