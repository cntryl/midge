[package]
name = "cntryl-midge-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WAL, writer leases, and persisted metadata for Midge"
license.workspace = true
repository.workspace = true
autobenches = false

[lib]
bench = false

[dependencies]
cntryl-midge-core.workspace = true
cntryl-midge-storage.workspace = true
cntryl-midge-table.workspace = true
arc-swap = "1.9"
bytes = { version = "1.12", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
crossbeam = "0.8"
fail = { version = "0.5", features = ["failpoints"], optional = true }
hex = "0.4"
hostname = "0.4"
parking_lot = "0.13"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
tracing = "0.1"
uuid = { version = "1.29", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
cntryl-midge-durability = { path = ".", default-features = false, features = ["internal-testing"] }
cntryl-stress = "0.5.1"
proptest = "1.12"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["cloud-all"]
cloud-common = ["cntryl-midge-storage/cloud-common"]
cloud-all = ["cloud-common", "cntryl-midge-storage/cloud-all"]
failpoints = ["dep:fail", "cntryl-midge-core/failpoints", "cntryl-midge-storage/failpoints"]
internal-testing = ["cntryl-midge-core/internal-testing", "cntryl-midge-storage/internal-testing", "cntryl-midge-table/internal-testing"]

[[bench]]
name = "tier1_hotpath_wal"
harness = false

[lints]
workspace = true
