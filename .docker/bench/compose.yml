services:
  bench:
    image: midge-bench
    build:
      context: ../..
      dockerfile: .docker/bench/Dockerfile
    working_dir: /app
    # Mount the repo so outputs are written next to this compose file
    volumes:
      - type: bind
        source: ../..
        target: /app
    environment:
      # Optional: enable extra features like "uring"; leave empty to run defaults
      FEATURES: ""
    # Default command runs all benches and exits; no restart policy needed
    restart: "no"
    # Uncomment to force a specific platform (useful on multi-arch hosts)
    # platform: linux/amd64
