[package]
name = "cntryl-midge"
version = "0.5.2"
edition = "2021"
resolver = "2"
rust-version = "1.97"
autobenches = false
description = "A high-performance embedded key-value database with LSM-tree storage"
license = "Apache-2.0"
repository = "https://github.com/cntryl/midge"
readme = "README.md"
exclude = ["possible-sst-design.md"]
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["database-implementations"]

[workspace.lints.clippy]
pedantic = "deny"

[lib]
name = "cntryl_midge"
path = "src/lib.rs"
bench = false

[[bin]]
name = "midge"
path = "src/bin/midge.rs"
bench = false

# `panic = "unwind"` (the default) stays: worker panics are isolated with
# `catch_unwind` so they fence the writer instead of aborting the process.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# =============================================================================
# Dependencies
# =============================================================================

[dependencies]
# Concurrency & Synchronization
arc-swap = "1.9"
crossbeam = "0.8"
dashmap = "6.2"
fail = { version = "0.5", features = ["failpoints"], optional = true }
parking_lot = "0.13"

# Randomness for skiplist tower heights and provider request jitter
rand = "0.10"

# Optional global allocator; see `docs/operations/performance-tuning.md`
mimalloc = { version = "0.1", optional = true }

# Compression
lz4_flex = "0.14"
zstd = "0.14"

# Data Types & Serialization
bytes = { version = "1.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4"] }

# Error Handling
thiserror = "2.0"

# Hashing
crc32c = "0.6"
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Logging & Tracing
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# OpenTelemetry (Observability)
opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.34", optional = true }

# System Utilities
hex = "0.4"
hostname = "0.4"
num_cpus = "1.17"
sysinfo = "0.39"
tempfile = "3.27"

# Cloud Backend Support (optional)
base64 = { version = "0.23", optional = true }
hmac = { version = "0.13", optional = true }
percent-encoding = { version = "2.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"], optional = true }
sha2 = "0.11"
md5 = { package = "md-5", version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"], optional = true }
ring = { version = "0.17", optional = true }
url = "2.5"
urlencoding = { version = "2.1", optional = true }
rmp-serde = "1.3"

# Platform-Specific Dependencies

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase"] }

# Model checking for the lock-free skiplist (#931): `RUSTFLAGS="--cfg midge_loom"`.
# The crate-specific name keeps dependencies that react to `cfg(loom)`, such
# as tokio, building normally.
[target.'cfg(midge_loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1.12"
cntryl-stress = "0.5.1"
hdrhistogram = "7.6"
sha2 = "0.11"
# Self dev-dependency: turns on `internal-testing` for tests/ and benches/ so
# they can reach implementation internals through `cntryl_midge::__internal`
# without those modules being public API for downstream consumers.
cntryl-midge = { path = ".", features = ["internal-testing"] }

# =============================================================================
# Features
# =============================================================================

[features]
default = ["cloud-all"]
failpoints = ["dep:fail"]
# Installs mimalloc as the global allocator of the `midge` binary. The library
# never installs an allocator; embedding applications choose their own.
alloc-mimalloc = ["dep:mimalloc"]
telemetry = [
    "cloud-common",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry_sdk",
]
telemetry-otlp = ["telemetry", "dep:opentelemetry-otlp"]
stress-soak = ["cloud-all"]
checkpoint-bench = ["internal-testing"]
# Enables the candidate-only #908 admission configuration in the Tier 4
# compaction backpressure benchmark. Keep this disabled for the preregistered
# base revision, whose public API predates WriteBackpressureConfig.
candidate-write-backpressure-bench = []

# Cloud storage backend support enabled by default for current deployment profiles.
cloud-common = [
    "dep:tokio",
    "dep:reqwest",
]
cloud-aws = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:percent-encoding",
    "dep:urlencoding",
]

sqrzl-tests = []

# Exposes `cntryl_midge::__internal` for this crate's own tests, benches and
# fuzz targets. Never enable it from a downstream crate: nothing behind it is
# stable API.
internal-testing = []
cloud-azure = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:md5",
    "dep:percent-encoding",
    "dep:urlencoding",
]
cloud-gcp = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:ring",
    "dep:sha1",
    "dep:percent-encoding",
    "dep:urlencoding",
]
cloud-oci = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:percent-encoding",
    "dep:urlencoding",
]
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci"]
cloud_integration = ["cloud-all"]


# Fault injection is run explicitly and serially because failpoints are
# process-global. Broad test selections must not run this target.
[[test]]
name = "fault_injection"
path = "tests/fault_injection.rs"
test = false
required-features = ["failpoints"]

# Exploratory measurement example; not a public engine configuration surface.
[[example]]
name = "benchmark_investigation"
required-features = ["internal-testing"]

