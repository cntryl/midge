[package]
name = "cntryl-midge"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.97"
autobenches = false
description = "A high-performance embedded key-value database with LSM-tree storage"
license = "Apache-2.0"
repository = "https://github.com/cntryl/midge"
readme = "README.md"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["database-implementations"]

[workspace.lints.clippy]
pedantic = "deny"

[lib]
name = "cntryl_midge"
path = "src/lib.rs"

# =============================================================================
# Dependencies
# =============================================================================

[dependencies]
# Concurrency & Synchronization
arc-swap = "1.9"
crossbeam = "0.8"
crossbeam-epoch = "0.9"
dashmap = "6.2"
fail = { version = "0.5", features = ["failpoints"], optional = true }
parking_lot = "0.12"

# Utilities used by stress workloads
rand = "0.10"
hdrhistogram = "7.5"

# Compression
lz4_flex = "0.13"
zstd = "0.13"

# Data Types & Serialization
bytes = { version = "1.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4"] }

# Error Handling
thiserror = "2.0"

# Hashing
crc32c = "0.6"
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Logging & Tracing
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# OpenTelemetry (Observability)
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.33", optional = true }

# System Utilities
hex = "0.4"
hostname = "0.4"
num_cpus = "1.17"
sysinfo = "0.39"
tempfile = "3.27"

# Cloud Backend Support (optional)
base64 = { version = "0.22", optional = true }
hmac = { version = "0.13", optional = true }
percent-encoding = { version = "2.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"], optional = true }
rsa = { version = "0.10.0-rc.18", features = ["sha2"], optional = true }
sha2 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"], optional = true }
url = { version = "2.5", optional = true }
urlencoding = { version = "2.1", optional = true }

# Platform-Specific Dependencies

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase"] }

[dev-dependencies]
proptest = "1.11"
cntryl-stress = { git = "https://github.com/cntryl/stress", branch = "main", package = "cntryl-stress" }

# =============================================================================
# Features
# =============================================================================

[features]
default = ["cloud-all"]
failpoints = ["dep:fail"]
telemetry = [
    "cloud-common",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry_sdk",
]
telemetry-otlp = ["telemetry", "dep:opentelemetry-otlp"]

# Cloud storage backend support enabled by default for current deployment profiles.
cloud-common = [
    "dep:tokio",
    "dep:reqwest",
]
cloud-aws = [
    "cloud-common",
    "dep:hmac",
    "dep:sha2",
    "dep:percent-encoding",
    "dep:url",
    "dep:urlencoding",
]

sqrzl-tests = []
cloud-azure = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:sha2",
    "dep:percent-encoding",
    "dep:url",
    "dep:urlencoding",
]
cloud-gcp = [
    "cloud-common",
    "dep:base64",
    "dep:hmac",
    "dep:sha1",
    "dep:sha2",
    "dep:percent-encoding",
    "dep:rsa",
    "dep:url",
    "dep:urlencoding",
]
cloud-oci = [
    "cloud-common",
    "dep:hmac",
    "dep:sha2",
    "dep:percent-encoding",
    "dep:url",
    "dep:urlencoding",
]
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci"]
cloud_integration = ["cloud-all"]


# Deterministic injection suites are compiled only when the non-production
# `failpoints` feature is selected explicitly.
[[test]]
name = "failure_injection"
path = "tests/failure_injection.rs"
required-features = ["failpoints"]

[[test]]
name = "transaction_crash_boundaries"
path = "tests/transaction_crash_boundaries.rs"
required-features = ["failpoints"]

[[test]]
name = "chaos_real"
path = "tests/chaos_real.rs"
required-features = ["failpoints"]

[[test]]
name = "chaos_intent_log"
path = "tests/chaos_intent_log.rs"
required-features = ["failpoints"]

[[test]]
name = "chaos_compaction"
path = "tests/chaos_compaction.rs"
required-features = ["failpoints"]


