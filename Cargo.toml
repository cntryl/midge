[workspace]
members = ["crates/core", "crates/durability", "crates/midge", "crates/storage", "crates/table"]
default-members = ["crates/midge"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/cntryl/midge"

[workspace.dependencies]
# Keep version requirements for these path dependencies aligned with workspace.package.version.
cntryl-midge-core = { version = "=0.6.1", path = "crates/core" }
cntryl-midge-durability = { version = "=0.6.1", path = "crates/durability", default-features = false }
cntryl-midge-storage = { version = "=0.6.1", path = "crates/storage", default-features = false }
cntryl-midge-table = { version = "=0.6.1", path = "crates/table" }

arc-swap = "1.9"
base64 = "0.23"
bytes = { version = "1.12", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
cntryl-stress = "0.5.1"
crc32c = "0.6"
crossbeam = "0.8"
dashmap = "6.2"
fail = { version = "0.5", features = ["failpoints"] }
hex = "0.4"
hmac = "0.13"
libc = "0.2"
md5 = { package = "md-5", version = "0.11" }
parking_lot = "0.13"
proptest = "1.12"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.29", features = ["v4"] }
winapi = { version = "0.3", features = ["fileapi", "winbase"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# `panic = "unwind"` (the default) stays: worker panics are isolated with
# `catch_unwind` so they fence the writer instead of aborting the process.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(midge_loom)'] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
too_many_lines = "forbid"
