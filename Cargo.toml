[package]
name = "cntryl-midge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
authors = ["Midge Contributors"]
description = "A high-performance embedded key-value database with LSM-tree storage"
license = "Apache-2.0"
repository = "https://github.com/cntryl/midge"
readme = "README.md"
homepage = "https://github.com/cntryl/midge#readme"
documentation = "https://docs.rs/cntryl-midge"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["database-implementations"]

exclude = ["/benches", "/testutils", "/scripts", "/.github", "/*.md"]

[lib]
name = "cntryl_midge"
path = "src/lib.rs"



# -----------------------------------------------------------------------------
# Core dependencies
# -----------------------------------------------------------------------------
[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Data types
bytes = { version = "1.10", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }

# Serialization
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Hashing
crc32c = "0.6"
crc32fast = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Concurrency primitives
arc-swap = "1.7"
crossbeam = "0.8"
crossbeam-channel = "0.5"
crossbeam-epoch = "0.9"
dashmap = "6.1"
parking_lot = "0.12"
rayon = "1.10"

# Time and logging
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# System utilities
byteorder = "1.5"
hex = "0.4"
hostname = "0.4"
num_cpus = "1.16"
sysinfo = "0.37"
once_cell = "1.21"

# Optional crypto / network utils (for cloud backends)
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
md5 = { version = "0.8", optional = true }
ureq = { version = "3", features = ["rustls", "json"], optional = true }
url = { version = "2.5", optional = true }
urlencoding = { version = "2.1", optional = true }
regex = "1.11"

# Platform-specific system calls
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase"] }

# -----------------------------------------------------------------------------
# Development dependencies
# -----------------------------------------------------------------------------
[dev-dependencies]
criterion = "0.7"
proptest = "1.8"
rand = "0.9"
tempfile = "3.23"
hdrhistogram = "7.3"
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# -----------------------------------------------------------------------------
# Optional dependencies
# -----------------------------------------------------------------------------
[dependencies.io-uring]
version = "0.7"
optional = true

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
default = []
logging = ["dep:tracing-subscriber"]

# Optional Linux io_uring backend for experimental async vectored I/O
uring = ["io-uring"]

# Common dependency group for cloud backends
cloud-common = ["dep:ureq", "dep:hmac", "dep:sha2", "dep:base64", "dep:url"]

# Combined feature for all clouds
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci"]

cloud-aws = ["cloud-common", "dep:md5"]
cloud-azure = ["cloud-common"]
cloud-gcp = ["cloud-common", "dep:urlencoding"]
cloud-oci = ["cloud-common", "dep:urlencoding"]

# -----------------------------------------------------------------------------
# Profiles
# -----------------------------------------------------------------------------
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = false # Keep symbols for debugging production issues

[profile.bench]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = false

# -----------------------------------------------------------------------------
# Docs.rs configuration
# -----------------------------------------------------------------------------
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

# -----------------------------------------------------------------------------
# Binaries
# -----------------------------------------------------------------------------
[[bin]]
name = "validate_tests"
path = "testutils/validate_tests.rs"

