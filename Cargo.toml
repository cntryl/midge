[package]
name = "cntryl-midge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobenches = false
description = "A high-performance embedded key-value database with LSM-tree storage"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["database", "kv", "lsm", "embedded", "storage"]
categories = ["database-implementations"]

[workspace]
members = ["crates/core", "crates/table", "crates/storage", "crates/durability"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/cntryl/midge"

[workspace.dependencies]
cntryl-midge-core = { version = "=0.6.0", path = "crates/core" }
cntryl-midge-table = { version = "=0.6.0", path = "crates/table" }
cntryl-midge-storage = { version = "=0.6.0", path = "crates/storage", default-features = false }
cntryl-midge-durability = { version = "=0.6.0", path = "crates/durability", default-features = false }

[lib]
bench = false

[[bin]]
name = "midge"
bench = false

# `panic = "unwind"` (the default) stays: worker panics are isolated with
# `catch_unwind` so they fence the writer instead of aborting the process.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

# =============================================================================
# Dependencies
# =============================================================================

[dependencies]
cntryl-midge-core.workspace = true
cntryl-midge-table.workspace = true
cntryl-midge-storage.workspace = true
cntryl-midge-durability.workspace = true

# Concurrency & Synchronization
arc-swap = "1.9"
crossbeam = "0.8"
dashmap = "6.2"
fail = { version = "0.5", features = ["failpoints"], optional = true }
parking_lot = "0.13"

# Randomness for workloads and qualification tests
rand = "0.10"

# Optional global allocator; see `docs/operations/performance-tuning.md`
mimalloc = { version = "0.1", optional = true }

# Data Types & Serialization
bytes = { version = "1.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4"] }

# Hashing
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Logging & Tracing
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# System Utilities
hex = "0.4"
sysinfo = "0.40"
tempfile = "3.27"

# Cloud workload setup (optional)
base64 = { version = "0.23", optional = true }
hmac = { version = "0.13", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"], optional = true }
sha2 = "0.11"
sha1 = { version = "0.11", optional = true }
rmp-serde = "1.3"

# Platform-Specific Dependencies

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase"] }

[dev-dependencies]
crc32fast = "1.5"
md5 = { package = "md-5", version = "0.11" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
num_cpus = "1.17"
proptest = "1.12"
cntryl-stress = "0.5.1"
hdrhistogram = "7.6"
# Self dev-dependency: turns on `internal-testing` for tests/ and benches/ so
# they can reach implementation internals through `cntryl_midge::__internal`
# without those modules being public API for downstream consumers.
cntryl-midge = { path = ".", default-features = false, features = ["internal-testing"] }

# =============================================================================
# Features
# =============================================================================

[features]
default = ["cloud-all"]
failpoints = [
    "dep:fail",
    "cntryl-midge-core/failpoints",
    "cntryl-midge-table/failpoints",
    "cntryl-midge-storage/failpoints",
    "cntryl-midge-durability/failpoints",
]
# Installs mimalloc as the global allocator of the `midge` binary. The library
# never installs an allocator; embedding applications choose their own.
alloc-mimalloc = ["dep:mimalloc"]
telemetry = [
    "cloud-common",
    "cntryl-midge-core/telemetry",
]
telemetry-otlp = ["telemetry", "cntryl-midge-core/telemetry-otlp"]

# Cloud storage backends, enabled by default for current deployment profiles.
cloud-common = ["cntryl-midge-storage/cloud-common", "cntryl-midge-durability/cloud-common", "dep:reqwest"]
# Request signing shared by every provider. Not a backend by itself.
cloud-signing = ["cloud-common", "cntryl-midge-storage/cloud-signing", "dep:base64", "dep:hmac"]
cloud-aws = ["cloud-signing", "cntryl-midge-storage/cloud-aws"]
cloud-azure = ["cloud-signing", "cntryl-midge-storage/cloud-azure"]
cloud-gcp = ["cloud-signing", "cntryl-midge-storage/cloud-gcp", "dep:sha1"]
cloud-oci = ["cloud-signing", "cntryl-midge-storage/cloud-oci"]
cloud-all = ["cloud-aws", "cloud-azure", "cloud-gcp", "cloud-oci", "cntryl-midge-durability/cloud-all"]

# Test and benchmark only. Never enable these from a downstream crate.
# Exposes `cntryl_midge::__internal` for this crate's own tests, benches and
# fuzz targets; nothing behind it is stable API.
internal-testing = [
    "cntryl-midge-core/internal-testing",
    "cntryl-midge-table/internal-testing",
    "cntryl-midge-storage/internal-testing",
    "cntryl-midge-durability/internal-testing",
]
sqrzl-tests = ["cntryl-midge-storage/sqrzl-tests"]
stress-soak = ["cloud-all"]
checkpoint-bench = ["internal-testing"]
# Enables the #908 admission configuration in the Tier 4 compaction
# backpressure benchmark; without it the row runs with hard stalls only.
candidate-write-backpressure-bench = []


# Fault injection is run explicitly and serially because failpoints are
# process-global. Broad test selections must not run this target.
[[test]]
name = "fault_injection"
test = false
required-features = ["failpoints"]

# Exploratory measurement example; not a public engine configuration surface.
[[example]]
name = "benchmark_investigation"
required-features = ["internal-testing"]

# =============================================================================
# Benchmarks — Active Targets
# =============================================================================
# Keep this manifest to active, harness-free benches. Experimental or disabled
# bench files stay under `benches/` until we want them in the supported set.

# Tier 1
[[bench]]
name = "tier1_hotpath_api"
harness = false

[[bench]]
name = "tier1_hotpath_keyed_group_commit"
harness = false

[[bench]]
name = "tier1_hotpath_event_loop"
harness = false

# Tier 2
[[bench]]
name = "tier2_subsystem_iterator_multi_sst"
harness = false

[[bench]]
name = "tier2_subsystem_read_amplification"
harness = false

[[bench]]
name = "tier2_subsystem_event_loop"
harness = false

[[bench]]
name = "tier2_subsystem_transaction_latency"
harness = false

[[bench]]
name = "tier2_subsystem_durability_commit_latency"
harness = false

[[bench]]
name = "tier2_subsystem_hybrid_durability_lag"
harness = false

[[bench]]
name = "tier2_subsystem_baseline_matrix"
harness = false

[[bench]]
name = "tier2_subsystem_compaction"
harness = false

# Tier 3
[[bench]]
name = "tier3_system_engine"
harness = false

[[bench]]
name = "tier3_system_mvcc"
harness = false

[[bench]]
name = "tier3_system_sst"
harness = false

[[bench]]
name = "tier3_system_scan"
harness = false

[[bench]]
name = "tier3_system_lifecycle"
harness = false

# Tier 4
[[bench]]
name = "tier4_system_checkpoint_write_amplification"
harness = false
required-features = ["checkpoint-bench"]

[[bench]]
name = "tier4_system_local_throughput_regression"
harness = false

[[bench]]
name = "tier4_system_strict_group_commit"
harness = false

[[bench]]
name = "tier4_system_compression_policy"
harness = false

[[bench]]
name = "tier4_ycsb_workload_a"
harness = false

[[bench]]
name = "tier4_system_compaction_backpressure"
harness = false

[[bench]]
name = "tier4_system_compaction_grandparent_cuts"
harness = false

[[bench]]
name = "tier4_system_sst_v5"
harness = false
required-features = ["internal-testing"]

[[bench]]
name = "tier4_system_sst_footprint"
harness = false

[[bench]]
name = "tier4_ycsb_workload_b"
harness = false

[[bench]]
name = "tier4_ycsb_workload_c"
harness = false

[[bench]]
name = "tier4_ycsb_workload_d"
harness = false

[[bench]]
name = "tier4_ycsb_workload_e"
harness = false

[[bench]]
name = "tier4_ycsb_workload_f"
harness = false

[[bench]]
name = "tier4_streaming_workload"
harness = false

[[bench]]
name = "tier4_system_recovery_throughput"
harness = false

[[bench]]
name = "tier4_bounded_compaction_qualification"
harness = false
required-features = ["failpoints"]

# Tiers 5 and 6 are opt-in, long-running stress campaigns. The required
# feature keeps ordinary `cargo bench` from starting a soak accidentally.
[[bench]]
name = "tier5_stress_workloads"
harness = false
required-features = ["stress-soak"]

[[bench]]
name = "tier5_hybrid_durability_lag"
harness = false
required-features = ["stress-soak"]

[[bench]]
name = "tier6_mixed_workload_soak"
harness = false
required-features = ["stress-soak"]

[[example]]
name = "checkpoint_campaign_readback"
path = "examples/checkpoint_campaign_readback.rs"
required-features = ["internal-testing"]

[lints]
workspace = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(midge_loom)'] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
too_many_lines = "forbid"
