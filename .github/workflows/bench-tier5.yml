name: Benchmark Tier 5

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload duration (60s smoke, 600s standard, 3600s extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: bench-tier5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [self-hosted, Linux, ubuntu-24.04]
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        workload:
          - tier5_write_heavy_local
          - tier5_read_heavy_local
          - tier5_balanced_local
          - tier5_many_small_transactions_local
          - tier5_mixed_transaction_sizes_local
          - tier5_write_pressure_s3
          - tier5_write_pressure_azure
          - tier5_write_pressure_gcs_xml
          - tier5_write_pressure_gcs_json

    services:
      sqrzl:
        # Local workloads do not need an emulator.
        image: >-
          ${{
            !endsWith(matrix.workload, '_local') && 'ghcr.io/sqrzl/sqrzl-emulator:latest'
            || ''
          }}
        ports:
          - 9000:9000
          - 9001:9001
        env:
          SQRZL_BLOBS_PATH: /app/blobs
          SQRZL_ACCESS_KEY_ID: admin
          SQRZL_SECRET_ACCESS_KEY: easy-peasy

    env:
      CARGO_INCREMENTAL: "0"
      SQRZL_SECRET_ACCESS_KEY: easy-peasy
      STRESS_PROFILE: smoke
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      # Scheduled campaigns retain the one-hour duration.
      MIDGE_STRESS_DURATION_SECS: ${{ inputs.profile == 'smoke' && '60' || inputs.profile == 'standard' && '600' || '3600' }}
      STRESS_TIMEOUT_SECS: ${{ inputs.profile == 'smoke' && '960' || inputs.profile == 'standard' && '1500' || '4500' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Run benchmarks
        run: cargo bench --locked --features stress-soak --bench tier5_stress_workloads -- --workload 'tier5_stress_workloads::${{ matrix.workload }}'

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier5-${{ matrix.workload }}-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore
