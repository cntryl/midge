name: Benchmark Tier 5

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload duration (60s smoke, 600s standard, 3600s extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read

concurrency:
  group: bench-tier5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        workload:
          - tier5_multi_family_hot_cold_local
          - tier5_write_heavy_local
          - tier5_read_heavy_local
          - tier5_balanced_local
          - tier5_many_small_transactions_local
          - tier5_mixed_transaction_sizes_local
          - tier5_write_pressure_s3
          - tier5_write_pressure_azure
          - tier5_write_pressure_gcs_xml
          - tier5_write_pressure_gcs_json
    uses: ./.github/workflows/run-stress-benchmark.yml
    with:
      bench: tier5_stress_workloads
      workload: ${{ matrix.workload }}
      profile: ${{ inputs.profile || 'extended' }}
      artifact_name: bench-tier5-${{ matrix.workload }}-${{ github.sha }}
