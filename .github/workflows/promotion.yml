name: Release promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_HEAD_REF: ${{ github.head_ref }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      TARGET_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Require this repository's develop branch
        run: |
          test "$PR_HEAD_REF" = develop
          test "$PR_HEAD_REPOSITORY" = "$TARGET_REPOSITORY"
