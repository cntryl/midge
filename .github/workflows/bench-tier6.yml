name: Benchmark Tier 6

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read

concurrency:
  group: bench-tier6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload:
          - tier6_mixed_workload_local
          - tier6_mixed_workload_s3
          - tier6_mixed_workload_azure
          - tier6_mixed_workload_gcs_xml
          - tier6_mixed_workload_gcs_json
    env:
      CARGO_INCREMENTAL: 0
      MIDGE_TIER6_DURATION_SECS: "3600"
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_PROFILE: smoke
      STRESS_TIMEOUT_SECS: "4500"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Start Sqrzl
        if: matrix.workload != 'tier6_mixed_workload_local'
        run: docker compose up -d sqrzl

      - name: Run Tier 6 workload
        env:
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
        run: cargo bench --bench 'tier6_*' --features stress-soak -- --workload ${{ matrix.workload }}

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier6-${{ matrix.workload }}-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore
          retention-days: 180

      - name: Stop Sqrzl
        if: always() && matrix.workload != 'tier6_mixed_workload_local'
        run: docker compose down -v
