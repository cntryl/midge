name: Benchmark Tier 6

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Workload seconds (600 quick, 3600 full)
        type: choice
        required: true
        default: "600"
        options: ["600", "3600"]
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read

concurrency:
  group: bench-tier6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload:
          - tier6_mixed_workload_local
          - tier6_mixed_workload_s3
          - tier6_mixed_workload_azure
          - tier6_mixed_workload_gcs_xml
          - tier6_mixed_workload_gcs_json
    env:
      CARGO_INCREMENTAL: 0
      MIDGE_TIER6_DURATION_SECS: ${{ github.event_name == 'workflow_dispatch' && (inputs.duration_seconds || '600') || '3600' }}
      STRESS_NO_PROGRESS_TIMEOUT_SECS: "60"
      STRESS_PROFILE: smoke
      STRESS_TIMEOUT_SECS: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_seconds != '3600' && '1500' || '4500' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Start Sqrzl
        if: matrix.workload != 'tier6_mixed_workload_local'
        run: docker compose up -d sqrzl

      - name: Run Tier 6 workload
        id: workload
        env:
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/midge-stress/runner-logs
          cargo bench --bench 'tier6_*' --features stress-soak -- --workload ${{ matrix.workload }} 2>&1 | tee target/midge-stress/runner-logs/workload.log

      - name: Preserve workload failure and emulator diagnostics
        if: always()
        env:
          WORKLOAD_OUTCOME: ${{ steps.workload.outcome }}
          SELECTED_WORKLOAD: ${{ matrix.workload }}
        run: |
          mkdir -p target/midge-stress/emulator-logs
          docker compose logs --no-color sqrzl > target/midge-stress/emulator-logs/sqrzl.log 2>&1 || true
          python3 tools/finalize_stress_artifacts.py --workload "$SELECTED_WORKLOAD" --suite tier6-mixed-workload-soak --sha "$GITHUB_SHA" --outcome "$WORKLOAD_OUTCOME"

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier6-${{ matrix.workload }}-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore

      - name: Stop Sqrzl
        if: always() && matrix.workload != 'tier6_mixed_workload_local'
        run: docker compose down -v
