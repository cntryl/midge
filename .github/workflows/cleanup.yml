name: Cleanup Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Cleanup Workflow Runs
        uses: fgrzl/actions/workflow-cleanup@b7faf5e18e77ea561dc6e7edaa95c0dfe32444d3 # v0.0.6
        with:
          days_old: 3
          per_page: 100
