name: WAL campaigns

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: wal-campaigns-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly WAL campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      MIDGE_CAMPAIGN_PROFILE: nightly
      MIDGE_CAMPAIGN_IMAGES: target/wal-campaigns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-core"

      - name: Run campaigns from a seed base that moves each run
        shell: bash
        run: |
          set -euo pipefail
          export MIDGE_CAMPAIGN_SEED_BASE=$(( GITHUB_RUN_NUMBER * 1000000 ))
          echo "seed base ${MIDGE_CAMPAIGN_SEED_BASE}"
          cargo test --test wal_campaigns --all-features -- --test-threads=1

      - name: Retain campaign images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wal-campaigns-nightly-${{ github.run_number }}-${{ github.sha }}
          path: target/wal-campaigns
          if-no-files-found: ignore
