name: Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "*.toml"

permissions:
  contents: read

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml
