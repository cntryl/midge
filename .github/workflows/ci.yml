name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  push:
    branches: [main]
    paths:
      - "compose.yml"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "docs/**"
      - "*.md"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "compose.yml"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "docs/**"
      - "*.md"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"

jobs:
  matrix:
    name: Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    env:
      CARGO_INCREMENTAL: 0

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Verify production contract docs are present
        shell: bash
        run: |
          test -f docs/development/one-dot-zero-contract.md
          test -f docs/development/support-matrix.md
          test -f docs/development/format-compatibility.md
          test -f docs/development/release-policy.md
          test -f docs/operations/production-runbook.md
          test -f docs/operations/release-checklist.md
          test -f docs/development/stability-policy.md
          test -f docs/operations/migration-guide.md
          test -f CHANGELOG.md

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --all-targets

  cloud-integration:
    name: Cloud integration (Sqrzl)
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-cloud-integration"

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Sqrzl qualification
        run: cargo test --lib --features sqrzl-tests storage::providers::qualification -- --test-threads=1

      - name: Full test suite against Sqrzl emulator
        run: cargo test

      - name: Stop Sqrzl emulator
        if: always()
        run: docker compose down -v
