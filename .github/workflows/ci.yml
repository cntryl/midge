name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  push:
    branches: [main]
    paths:
      - "compose.yml"
      - "Dockerfile*"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "docs/**"
      - "fuzz/**"
      - "scripts/**"
      - "*.md"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "compose.yml"
      - "Dockerfile*"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "docs/**"
      - "fuzz/**"
      - "scripts/**"
      - "*.md"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"

jobs:
  matrix:
    name: Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    env:
      CARGO_INCREMENTAL: 0

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci"

      - name: Verify production contract docs are present
        shell: bash
        run: |
          test -f docs/development/one-dot-zero-contract.md
          test -f docs/development/support-matrix.md
          test -f docs/development/format-compatibility.md
          test -f docs/development/release-policy.md
          test -f docs/operations/production-runbook.md
          test -f docs/operations/release-checklist.md
          test -f docs/development/stability-policy.md
          test -f docs/operations/migration-guide.md
          test -f CHANGELOG.md

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV and no-default features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.93 --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-msrv"

      - name: Check MSRV
        run: cargo +1.93 check --workspace --all-targets

      - name: Strict no-default Clippy
        run: cargo +1.93 clippy --workspace --all-targets --no-default-features -- -D warnings -D clippy::pedantic

  cloud-integration:
    name: Cloud integration (Sqrzl)
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0
      MIDGE_REQUIRE_SQRZL: 1

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "ci-cloud-integration"

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Wait for Sqrzl health
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:9001/healthz

      - name: Sqrzl qualification
        run: cargo test --lib --features sqrzl-tests storage::providers::qualification -- --test-threads=1

      - name: Provider engine qualification
        run: cargo test --test cloud_provider_engine_qualification --features sqrzl-tests -- --test-threads=1

      - name: Full test suite against Sqrzl emulator
        run: cargo test --workspace --all-features

      - name: Stop Sqrzl emulator
        if: always()
        run: docker compose down -v
