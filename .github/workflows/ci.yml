name: CI

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "41 3 * * 3"
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Core (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-core"

      - name: Install test validator
        run: cargo install --git https://github.com/cntryl/tools

      - name: Validate tests
        run: cntryl-tools validate-tests

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Test
        run: cargo test --locked --workspace --features failpoints

  fault-injection:
    name: Serial fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-fault-injection"

      - name: Fault injection tests
        run: cargo test --locked --test fault_injection --features failpoints -- --test-threads=1
