name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  push:
    branches: [main]
    paths:
      - "compose.yml"
      - "src/**"
      - "tests/**"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "compose.yml"
      - "src/**"
      - "tests/**"
      - "*.toml"
      - ".cargo/**"
      - ".github/workflows/**"

jobs:
  matrix:
    name: Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    env:
      CARGO_INCREMENTAL: 0

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: true

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Verify production contract docs are present
        shell: bash
        run: |
          test -f docs/development/one-dot-zero-contract.md
          test -f docs/development/support-matrix.md
          test -f docs/development/format-compatibility.md
          test -f docs/development/release-policy.md
          test -f docs/operations/production-runbook.md
          test -f docs/operations/release-checklist.md
          test -f docs/development/stability-policy.md
          test -f docs/operations/migration-guide.md
          test -f CHANGELOG.md

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test (without Peas emulator qualification)
        run: cargo test -- --skip storage::providers::qualification

  io-uring:
    name: Linux io_uring
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-io-uring"

      - name: io_uring clippy
        run: cargo clippy --all-targets --features uring -- -D warnings

      - name: io_uring build check
        run: cargo check --tests --features uring

      - name: io_uring backend tests
        run: cargo test --test io_uring_backend --features uring

      - name: io_uring library tests
        run: cargo test --lib --features uring

  cloud-integration:
    name: Cloud integration (Peas)
    runs-on: ubuntu-latest

    env:
      CARGO_INCREMENTAL: 0

    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-cloud-integration"

      - name: Start Peas emulator
        run: docker compose up -d peas

      - name: Peas qualification
        run: cargo test --lib --features peas-tests storage::providers::qualification -- --test-threads=1

      - name: Full test suite against Peas emulator
        run: cargo test

      - name: Stop Peas emulator
        if: always()
        run: docker compose down -v
