name: CI

on:
  workflow_dispatch:
    inputs:
      tier3_lifecycle_bench:
        description: Run Tier 3 lifecycle benchmarks on all supported operating systems
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * 3"
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-core"

      - name: Install test validator
        run: cargo install --git https://github.com/cntryl/tools

      - name: Validate test contracts
        run: cntryl-tools validate-tests

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Unit and binary tests
        run: cargo test --lib --bins --all-features -- --test-threads=1

      - name: Integration tests
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/*.rs; do
            target="${source#tests/}"
            target="${target%.rs}"
            if [[ "$target" == "fault_injection" ]]; then
              continue
            fi
            if [[ "$target" == "discovery_model" ]]; then
              MIDGE_DISCOVERY_PROFILE=pr cargo test --test "$target" --all-features -- --test-threads=1
            else
              cargo test --test "$target" --all-features -- --test-threads=1
            fi
          done

      - name: Retain discovery corpus and counterexamples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-model-${{ github.sha }}
          path: target/discovery-031
          if-no-files-found: ignore

      - name: Test named backup and empty-compaction aborts
        env:
          MIDGE_PHYSICAL_DISCOVERY: "1"
        run: cargo test --test discovery_model --all-features physical::should_execute_named_abort_histories -- --test-threads=1

      - name: Fault injection suite (serial; failpoints are process-global)
        run: cargo test --test fault_injection --all-features -- --test-threads=1

      - name: Verify default release excludes failpoints
        shell: bash
        run: |
          if cargo tree --edges normal | grep -E '(^|[[:space:]])fail v'; then
            echo "default dependency graph unexpectedly contains fail"
            exit 1
          fi
          cargo check --release

      - name: Public API names every type it exposes
        run: |
          cargo rustc --lib -- -D unnameable_types
          cargo rustc --lib --no-default-features -- -D unnameable_types

      - name: Production build has no dead code
        run: cargo rustc --lib --no-default-features --features cloud-all -- -D dead_code

  platform:
    name: OS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "platform-${{ matrix.os }}"

      - name: Verify release build
        if: matrix.os == 'macos-latest'
        run: cargo check --release

      - name: Test Windows filesystem operations
        if: matrix.os == 'windows-latest'
        run: cargo test --lib io::real::tests --all-features

      - name: Test cloud WAL salvage on Windows
        if: matrix.os == 'windows-latest'
        run: cargo test --lib streaming_wal_plan::tests --all-features

      - name: Test cloud SST loss classification on Windows
        if: matrix.os == 'windows-latest'
        run: cargo test --lib should_treat_missing_child --all-features

      - name: Test cloud SST salvage on Windows
        if: matrix.os == 'windows-latest'
        run: cargo test --lib salvage_removes_definitively_lost_ssts --all-features

      - name: Test consistent-cut backup and restore on Windows
        if: matrix.os == 'windows-latest'
        run: |
          cargo test --lib engine::backup::tests --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test engine_api consistent_cut_backup --all-features -- --test-threads=1

      - name: Test backup path isolation and publication
        shell: bash
        run: |
          set -euo pipefail
          cargo test --test backup_paths --all-features
          cargo test --test backup_publish_races --all-features -- --test-threads=1

      - name: Test named backup and empty-compaction aborts
        env:
          MIDGE_PHYSICAL_DISCOVERY: "1"
        run: cargo test --test discovery_model --all-features physical::should_execute_named_abort_histories -- --test-threads=1

      - name: Test workspace
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace --features telemetry-otlp,sqrzl-tests,cloud_integration

      - name: Fault injection suite (serial; failpoints are process-global)
        if: matrix.os == 'macos-latest'
        run: cargo test --test fault_injection --all-features -- --test-threads=1

  tier3_lifecycle_bench:
    name: Tier 3 lifecycle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.tier3_lifecycle_bench
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "tier3-lifecycle-${{ matrix.os }}"

      - name: Run Tier 3 lifecycle benchmark
        run: cargo bench --bench tier3_system_lifecycle -- --profile default
