name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish cntryl-midge to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish"

      - name: Read crate version from Cargo.toml
        id: crate
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -er '.packages[] | select(.name == "cntryl-midge") | .version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check crate
        run: cargo check --locked

      - name: Build crate
        run: cargo build --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish cntryl-midge to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Tag published version
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          tag="v${CRATE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            test "$(git rev-parse "${tag}^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$tag" HEAD
            git push origin "refs/tags/${tag}"
          fi
