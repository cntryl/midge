name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-gate"

      - name: Verify production contract docs are present
        shell: bash
        run: |
          test -f docs/development/one-dot-zero-contract.md
          test -f docs/development/support-matrix.md
          test -f docs/development/format-compatibility.md
          test -f docs/development/release-policy.md
          test -f docs/operations/production-runbook.md
          test -f docs/operations/release-checklist.md
          test -f docs/development/stability-policy.md
          test -f docs/operations/migration-guide.md
          test -f CHANGELOG.md

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --locked

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Full test suite
        run: cargo test

      - name: Trust-critical smoke suite
        run: cargo test --test external_adopter_smoke

      - name: Recovery correctness suite
        run: cargo test --test durability_wal

      - name: Failure injection suite
        run: cargo test --test failure_injection

      - name: Compaction crash suite
        run: cargo test --test chaos_compaction

      - name: Iterator correctness suite
        run: cargo test --test engine_iterators

      - name: Compatibility suite
        run: cargo test --test compatibility_fixtures

      - name: Validate tests
        run: cntryl-tools validate-tests

      - name: Verify checked-in sample database
        run: cargo run --bin midge -- verify --json tests/fixtures/compatibility/v2_empty_db

      - name: Stop Sqrzl emulator
        if: always()
        run: docker compose down -v

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish"

      - name: Build release
        run: cargo build --release

      - name: Login
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
