name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  release-gate:
    name: Run release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${crate_version}"

      - name: Install stable Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-gate"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --rev 1ceecf1a6501793080235d2d46b2982f1424727c --locked

      - name: Validate current documentation inventory
        shell: bash
        run: |
          cntryl-tools validate-docs --config .cntryl/repository.toml
          test -f docs/development/support-matrix.md
          test -f docs/development/format-compatibility.md
          test -f docs/development/release-policy.md
          test -f docs/operations/operator-runbook.md
          test -f docs/operations/release-checklist.md
          test -f docs/development/stability-policy.md
          test -f docs/operations/migration-guide.md
          test -f CHANGELOG.md

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked

      - name: Run rustfmt check
        run: cargo fmt --check

      - name: Run Clippy checks
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Compile crate documentation
        run: cargo test --workspace --all-features --doc

      - name: Compile canonical documentation example
        run: cargo check --example documented_quick_start --all-features

      - name: Reject unused dependencies
        run: cargo machete

      - name: Verify publishable package
        run: cargo package --locked

      - name: Verify default release excludes failpoints
        shell: bash
        run: |
          if cargo tree --edges normal | grep -E '(^|[[:space:]])fail v'; then
            echo "default dependency graph unexpectedly contains fail"
            exit 1
          fi
          cargo check --release

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Wait for Sqrzl health
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:9001/healthz

      - name: Full test suite
        run: cargo test --workspace --all-features

      - name: Sqrzl provider qualification
        run: cargo test --lib --features sqrzl-tests storage::providers::qualification -- --ignored --test-threads=1

      - name: Sqrzl engine qualification
        run: cargo test --test cloud_provider_engine_qualification --features sqrzl-tests -- --ignored --test-threads=1

      - name: Trust-critical smoke suite
        run: cargo test --test external_adopter_smoke --features failpoints

      - name: Recovery correctness suite
        run: cargo test --test durability_wal

      - name: Failure injection suite
        run: cargo test --test failure_injection --features failpoints

      - name: Compaction crash suite
        run: cargo test --test chaos_compaction --features failpoints

      - name: Iterator correctness suite
        run: cargo test --test engine_iterators

      - name: Compatibility suite
        run: cargo test --test compatibility_fixtures

      - name: Validate test conventions
        run: cntryl-tools validate-tests

      - name: Verify checked-in sample database
        run: cargo run --bin midge -- verify --json tests/fixtures/compatibility/v3_populated_v4_sst_db

      - name: Stop Sqrzl emulator
        if: always()
        run: docker compose down -v

  publish:
    name: Publish cntryl-midge to crates.io
    needs: release-gate
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish cntryl-midge to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
