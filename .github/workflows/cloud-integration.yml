name: Cloud Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.sha }}
  cancel-in-progress: true

jobs:
  sqrzl:
    name: Sqrzl provider and engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      MIDGE_QUALIFICATION_ARTIFACT_DIR: ${{ github.workspace }}/target/cloud-qualification-evidence/${{ github.run_id }}-${{ github.run_attempt }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record qualified revision
        id: revision
        shell: bash
        run: |
          revision="$(git rev-parse HEAD)"
          echo "MIDGE_QUALIFICATION_REVISION=${revision}" >> "$GITHUB_ENV"
          echo "sha=${revision}" >> "$GITHUB_OUTPUT"

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cloud"

      - name: Start Sqrzl emulator
        run: docker compose up -d sqrzl

      - name: Wait for Sqrzl health
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:9001/healthz

      - name: Sqrzl qualification
        env:
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
        run: cargo test --lib --features sqrzl-tests storage::providers::qualification -- --ignored --test-threads=1

      - name: Provider engine qualification
        env:
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
        run: cargo test --test cloud_provider_engine_qualification --features sqrzl-tests,failpoints -- --ignored --test-threads=1

      - name: Fixed-seed logical histories through supported providers
        env:
          SQRZL_SECRET_ACCESS_KEY: easy-peasy
          MIDGE_DISCOVERY_PROFILE: sqrzl
          MIDGE_DISCOVERY_ARTIFACT_DIR: ${{ github.workspace }}/target/cloud-qualification-evidence/${{ github.run_id }}-${{ github.run_attempt }}/model
        run: cargo test --test discovery_model --features sqrzl-tests -- --test-threads=1

      - name: Preserve cloud qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-qualification-${{ steps.revision.outputs.sha }}
          path: target/cloud-qualification-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore

      - name: Stop Sqrzl emulator
        if: always()
        run: docker compose down -v
