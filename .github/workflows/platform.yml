name: Platform

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.sha }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout pushed main revision
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Checkout main for scheduled or manual qualification
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "platform-${{ matrix.os }}"

      - name: Verify release build
        run: cargo check --release

      - name: Test workspace
        run: cargo test --workspace --features telemetry,telemetry-otlp,cloud-common,cloud-aws,sqrzl-tests,cloud-azure,cloud-gcp,cloud-oci,cloud-all,cloud_integration

      - name: Fault injection suite (serial; failpoints are process-global)
        run: cargo test --test fault_injection --all-features -- --test-threads=1
