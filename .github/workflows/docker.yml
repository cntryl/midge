name: Docker Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 5"
  push:
    branches: [main]
    paths:
      - "compose.yml"
      - ".dockerignore"
      - "Dockerfile*"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "compose.yml"
      - ".dockerignore"
      - "Dockerfile*"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-image:
    name: Docker test image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build test image
        run: docker build --file Dockerfile.tests --tag midge-tests:ci .
