name: Testing Governance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  coverage-tier-diff:
    name: Coverage tier diff (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Unit-only coverage
        run: cargo llvm-cov --lib --all-features --json --output-path unit-coverage.json
      - name: Integration-only coverage
        shell: bash
        run: |
          mapfile -t targets < <(find tests -maxdepth 1 -type f -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort)
          test "${#targets[@]}" -gt 0
          args=()
          for target in "${targets[@]}"; do
            args+=(--test "$target")
          done
          cargo llvm-cov --all-features --json --output-path integration-coverage.json "${args[@]}"
      - name: Build informational island report
        run: python3 scripts/coverage_tier_diff.py unit-coverage.json integration-coverage.json | tee coverage-tier-diff.md
      - name: Publish summary
        run: cat coverage-tier-diff.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-tier-diff
          path: |
            unit-coverage.json
            integration-coverage.json
            coverage-tier-diff.md

  mutation-pilot:
    name: Mutation pilot (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run storage-critical mutation pilot
        id: mutants
        run: |
          set +e
          cargo mutants --no-shuffle \
            --shard 1/512 --sharding round-robin --jobs 2 \
            --file 'src/compaction/**' --file 'src/lease/**' \
            --file 'src/wal/**' --file 'src/metadata/**' --file 'src/runtime/**' \
            2>&1 | tee mutation-pilot.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          case "$status" in
            0|2|3) ;;
            *) exit "$status" ;;
          esac
      - name: Validate mutation report
        run: python3 scripts/mutation_report.py mutants.out/outcomes.json | tee mutation-pilot.md
      - name: Publish summary
        run: |
          cat mutation-pilot.md >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Informational scheduled run; surviving mutants require triage, not a PR failure.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-pilot
          path: |
            mutation-pilot.log
            mutation-pilot.md
            mutants.out
