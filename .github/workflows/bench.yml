name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Build all benchmarks
        run: cargo bench --no-run

      - name: Run Tier 1 benchmarks (hotpath)
        run: cargo bench --bench 'tier1_*'

      - name: Run Tier 2 benchmarks (subsystem)
        run: cargo bench --bench 'tier2_*'

      - name: Run Tier 3 benchmarks (system)
        run: cargo bench --bench 'tier3_*'

      - name: Run Tier 4 benchmarks (YCSB & streaming)
        run: cargo bench --bench 'tier4_*'

      - name: Upload Criterion artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bench-artifacts-${{ matrix.os }}
          path: |
            target/criterion/**
            target/stress/**
