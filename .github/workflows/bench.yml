name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 6"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-guard:
    if: github.event_name == 'pull_request'
    name: Performance regression guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      BENCHMARK: tier4_system_local_throughput_regression
      WORKLOAD: memory

    steps:
      - name: Checkout candidate with base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect performance-relevant changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- \
            src benches Cargo.toml Cargo.lock .cargo \
            scripts/compare_benchmark_guardrail.py .github/workflows/bench.yml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Rust toolchain
        if: steps.changes.outputs.relevant == 'true'
        run: rustup update stable

      - name: Cache Rust dependencies
        if: steps.changes.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench-guard"

      - name: Create isolated base checkout
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          git worktree add ../midge-bench-base "${{ github.event.pull_request.base.sha }}"
          cargo generate-lockfile --manifest-path ../midge-bench-base/Cargo.toml
          cargo generate-lockfile

      - name: Build and measure base benchmark
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          mkdir -p target/benchmark-guardrail
          CARGO_TARGET_DIR="$PWD/target/benchmark-guard-build" cargo bench \
            --locked --manifest-path ../midge-bench-base/Cargo.toml \
            --bench "$BENCHMARK" --no-run
          for run in 1 2 3; do
            CARGO_TARGET_DIR="$PWD/target/benchmark-guard-build" cargo bench \
              --locked --manifest-path ../midge-bench-base/Cargo.toml \
              --bench "$BENCHMARK" -- \
              --profile release --workload "$WORKLOAD" --json \
              > "target/benchmark-guardrail/base-$run.json"
          done

      - name: Build and measure candidate benchmark
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          CARGO_TARGET_DIR="$PWD/target/benchmark-guard-build" cargo bench \
            --locked --bench "$BENCHMARK" --no-run
          for run in 1 2 3; do
            CARGO_TARGET_DIR="$PWD/target/benchmark-guard-build" cargo bench \
              --locked --bench "$BENCHMARK" -- \
              --profile release --workload "$WORKLOAD" --json \
              > "target/benchmark-guardrail/candidate-$run.json"
          done

      - name: Enforce Tier 4 regression budget
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          python3 scripts/compare_benchmark_guardrail.py \
            --base target/benchmark-guardrail/base-1.json \
            --base target/benchmark-guardrail/base-2.json \
            --base target/benchmark-guardrail/base-3.json \
            --candidate target/benchmark-guardrail/candidate-1.json \
            --candidate target/benchmark-guardrail/candidate-2.json \
            --candidate target/benchmark-guardrail/candidate-3.json \
            --benchmark memory_batched_write_throughput \
            --max-regression 0.15 | tee target/benchmark-guardrail/comparison.txt

      - name: Upload performance evidence
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: performance-regression-guard
          path: target/benchmark-guardrail
          retention-days: 30

  bench:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "bench"

      - name: Install cntryl-tools
        run: cargo install --git https://github.com/cntryl/tools --rev 1ceecf1a6501793080235d2d46b2982f1424727c --locked

      - name: Build all benchmarks
        run: cargo bench --no-run

      - name: Run Tier 1 benchmarks (hotpath)
        run: cargo bench --bench 'tier1_*'

      - name: Run Tier 2 benchmarks (subsystem)
        run: cargo bench --bench 'tier2_*'

      - name: Run Tier 3 benchmarks (system)
        run: cargo bench --bench 'tier3_*'

      - name: Run Tier 4 benchmarks (integration)
        run: cargo bench --bench 'tier4_*'

      - name: Generate benchmark summary
        run: cntryl-tools summarize-benchmarks

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v7
        with:
          name: bench-summary-${{ matrix.os }}
          path: target/bench_summary.md
