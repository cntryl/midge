name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"

jobs:
  bench:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Run benchmarks
        run: cargo bench --bench 'tier1_*' --bench 'tier2_*' --bench 'tier3_*' --bench 'tier4_*'

      - name: Upload Criterion artifacts
        uses: actions/upload-artifact@v6
        with:
          name: criterion-artifacts-${{ matrix.os }}
          path: |
            target/criterion/**
            target/stress/**
