name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV and no-default features
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97 toolchain
        run: rustup toolchain install 1.97 --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-msrv"

      - name: Check MSRV
        run: rustup run 1.97 cargo check --workspace --all-targets

      - name: Strict no-default Clippy
        run: rustup run 1.97 cargo clippy --workspace --all-targets --no-default-features -- -D warnings -D clippy::pedantic

  provider-features:
    name: Provider feature (${{ matrix.provider }})
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [cloud-aws, cloud-azure, cloud-gcp, cloud-oci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-provider-${{ matrix.provider }}"

      - name: Check isolated provider feature
        run: cargo check --workspace --all-targets --no-default-features --features ${{ matrix.provider }}
