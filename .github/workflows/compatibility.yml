name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.sha }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV and no-default features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v7

      - name: Install Rust 1.97 toolchain
        run: rustup toolchain install 1.97 --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-msrv"

      - name: Check MSRV
        run: rustup run 1.97 cargo check --workspace --all-targets

      - name: Strict no-default Clippy
        run: rustup run 1.97 cargo clippy --workspace --all-targets --no-default-features -- -D warnings -D clippy::pedantic

  isolated-features:
    name: Isolated feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature: [cloud-aws, cloud-azure, cloud-gcp, cloud-oci, telemetry]
    steps:
      - name: Checkout event revision
        uses: actions/checkout@v7

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-feature-${{ matrix.feature }}"

      - name: Check isolated feature
        run: cargo check --workspace --all-targets --no-default-features --features ${{ matrix.feature }}
