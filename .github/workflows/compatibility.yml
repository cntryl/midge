name: Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.sha }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV and no-default features
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pushed main revision
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Checkout main for scheduled or manual qualification
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust 1.97 toolchain
        run: rustup toolchain install 1.97 --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-msrv"

      - name: Check MSRV
        run: rustup run 1.97 cargo check --workspace --all-targets

      - name: Strict no-default Clippy
        run: rustup run 1.97 cargo clippy --workspace --all-targets --no-default-features -- -D warnings -D clippy::pedantic

  provider-features:
    name: Provider feature (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [cloud-aws, cloud-azure, cloud-gcp, cloud-oci]
    steps:
      - name: Checkout pushed main revision
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Checkout main for scheduled or manual qualification
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compatibility-provider-${{ matrix.provider }}"

      - name: Check isolated provider feature
        run: cargo check --workspace --all-targets --no-default-features --features ${{ matrix.provider }}
