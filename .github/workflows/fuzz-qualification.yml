name: Fuzz Qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: nightly-2026-07-01
    steps:
      - uses: actions/checkout@v7
        with:
          ref: eacf3d62128d3aabb5dae785904febe22a6c991b
      - name: Install original toolchain and symbolizer
        run: |
          rustup toolchain install nightly-2026-07-01 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          sudo apt-get update
          sudo apt-get install -y llvm
          echo "ASAN_SYMBOLIZER_PATH=$(command -v llvm-symbolizer)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
      - name: Preserve original corpus and input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37686932618 --repo cntryl/midge --name fuzz-qualification-eacf3d62128d3aabb5dae785904febe22a6c991b-1 --dir original
          sha256sum original/artifacts/intent_log_replay/timeout-32096c2e0eff33d844ee6d675407ace18289357d
      - name: Build original fuzz target
        run: cargo fuzz build intent_log_replay
      - name: Replay isolated one-byte timeout
        run: cargo fuzz run intent_log_replay original/artifacts/intent_log_replay/timeout-32096c2e0eff33d844ee6d675407ace18289357d -- -runs=128 -timeout=10
      - name: Replay original mutation seed from original starting corpus
        if: ${{ !cancelled() }}
        run: |
          mkdir -p diagnostic-corpus
          cp tests/fixtures/fuzz/intent_timeout_18.bin diagnostic-corpus/
          cargo fuzz run intent_log_replay diagnostic-corpus -- -seed=1504688986 -runs=2048 -timeout=10
      - name: Replay preserved failure corpus
        if: ${{ !cancelled() }}
        run: cargo fuzz run intent_log_replay original/corpus/intent_log_replay -- -runs=2048 -timeout=10
      - name: Preserve symbolized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intent-timeout-diagnostic-${{ github.run_id }}
          path: |
            fuzz/artifacts
            fuzz/target/x86_64-unknown-linux-gnu/release/intent_log_replay
            diagnostic-corpus
            original
