name: Benchmark Tier 2

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Measurement intensity (smoke, standard, extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard
      run_mode:
        description: Run the full Tier 2 matrix, one workload, or same-runner A/B campaign
        type: choice
        options: [full, targeted, ab]
        default: full
      bench:
        description: Cargo benchmark target for targeted mode
        type: string
        default: ""
      workload:
        description: cntryl-stress workload name for targeted mode
        type: string
        default: ""
      source_ref:
        description: Source branch or commit SHA to benchmark (blank uses the selected workflow ref)
        type: string
        default: ""
      benchmark_ref:
        description: Optional ref supplying the same benchmark source when it is absent from source_ref
        type: string
        default: ""
      base_ref:
        description: Exact base source SHA for same-runner A/B mode
        type: string
        default: ""
      candidate_ref:
        description: Exact candidate source SHA for same-runner A/B mode
        type: string
        default: ""
      samples:
        description: Measured samples per workload
        type: choice
        options: [5, 10]
        default: "5"
      warmup_samples:
        description: Warmup samples per workload
        type: choice
        options: [1, 2]
        default: "1"

permissions:
  contents: read

concurrency:
  group: bench-tier2-${{ github.ref }}-${{ inputs.run_mode != 'full' && github.run_id || 'matrix' }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    if: inputs.run_mode == 'full'

    strategy:
      fail-fast: false
      matrix:
        bench:
          - tier2_subsystem_block_cache
          - tier2_subsystem_bloom_build
          - tier2_subsystem_compression
          - tier2_subsystem_range_scan_cache
          - tier2_subsystem_iterator_multi_sst
          - tier2_subsystem_memtable_rotate
          - tier2_subsystem_read_amplification
          - tier2_subsystem_event_loop
          - tier2_subsystem_transaction_latency
          - tier2_subsystem_durability_commit_latency

    env:
      CARGO_INCREMENTAL: "0"
      # Use the harness defaults for each measurement intensity.
      STRESS_PROFILE: ${{ inputs.profile == 'smoke' && 'smoke' || inputs.profile == 'extended' && 'lab' || 'default' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Capture benchmark environment
        run: |
          rustc --version --verbose
          uname -a
          uptime

      - name: Run benchmarks
        run: cargo bench --locked --bench '${{ matrix.bench }}' -- --samples '${{ inputs.samples }}' --warmup-samples '${{ inputs.warmup_samples }}' --no-progress --require-quiet-env

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier2-${{ matrix.bench }}-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore

  ab:
    if: inputs.run_mode == 'ab'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      STRESS_PROFILE: ${{ inputs.profile == 'smoke' && 'smoke' || inputs.profile == 'extended' && 'lab' || 'default' }}
      BENCH_NAME: ${{ inputs.bench }}
      WORKLOAD_NAME: ${{ inputs.workload }}
      BASE_SOURCE_REF: ${{ inputs.base_ref }}
      CANDIDATE_SOURCE_REF: ${{ inputs.candidate_ref }}
      BENCHMARK_SOURCE_REF: ${{ inputs.benchmark_ref }}
      SAMPLE_COUNT: ${{ inputs.samples }}
      WARMUP_COUNT: ${{ inputs.warmup_samples }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout benchmark source overlay
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.benchmark_ref }}
          path: .benchmark-overlay

      - name: Prepare exact source checkouts and shared benchmark
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/midge-ab-target" >> "$GITHUB_ENV"
          [[ "$BENCH_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$WORKLOAD_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$BASE_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CANDIDATE_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$BENCHMARK_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch origin "$BASE_SOURCE_REF" "$CANDIDATE_SOURCE_REF"
          mkdir -p "$RUNNER_TEMP/midge-ab"
          git worktree add --detach "$RUNNER_TEMP/midge-ab/base" "$BASE_SOURCE_REF"
          git worktree add --detach "$RUNNER_TEMP/midge-ab/candidate" "$CANDIDATE_SOURCE_REF"
          for source in "$RUNNER_TEMP/midge-ab/base" "$RUNNER_TEMP/midge-ab/candidate"; do
            cp ".benchmark-overlay/benches/${BENCH_NAME}.rs" "$source/benches/${BENCH_NAME}.rs"
            if ! grep -Fq "name = \"${BENCH_NAME}\"" "$source/Cargo.toml"; then
              printf '\n[[bench]]\nname = "%s"\npath = "benches/%s.rs"\nharness = false\n' \
                "$BENCH_NAME" "$BENCH_NAME" >> "$source/Cargo.toml"
            fi
          done
          printf 'base=%s\ncandidate=%s\nbenchmark=%s\n' \
            "$BASE_SOURCE_REF" "$CANDIDATE_SOURCE_REF" "$BENCHMARK_SOURCE_REF"

      - name: Run alternating A/B samples on this runner
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/midge-ab/base"
          candidate="$RUNNER_TEMP/midge-ab/candidate"
          failed=0
          run_one() {
            local label="$1" source="$2" output result
            output="$GITHUB_WORKSPACE/target/stress/ab/$label"
            mkdir -p "$output"
            printf '\n=== %s source %s ===\n' "$label" "$(git -C "$source" rev-parse HEAD)"
            uname -a
            rustc --version --verbose
            uptime
            set +e
            (cd "$source" && cargo bench --locked --bench "$BENCH_NAME" -- \
              --workload "${BENCH_NAME}::${WORKLOAD_NAME}" \
              --samples "$SAMPLE_COUNT" --warmup-samples "$WARMUP_COUNT" \
              --no-progress --require-quiet-env --output-dir "$output")
            result=$?
            set -e
            uptime
            return "$result"
          }
          run_one A1 "$base" || failed=1
          run_one B1 "$candidate" || failed=1
          run_one A2 "$base" || failed=1
          run_one B2 "$candidate" || failed=1
          run_one A3 "$base" || failed=1
          run_one B3 "$candidate" || failed=1
          exit "$failed"

      - name: Upload alternating A/B reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier2-ab-${{ inputs.workload }}-${{ github.run_id }}
          path: target/stress/ab/**
          if-no-files-found: ignore

  targeted:
    if: inputs.run_mode == 'targeted'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      STRESS_PROFILE: ${{ inputs.profile == 'smoke' && 'smoke' || inputs.profile == 'extended' && 'lab' || 'default' }}
      BENCH_NAME: ${{ inputs.bench }}
      WORKLOAD_NAME: ${{ inputs.workload }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Checkout benchmark source overlay
        if: inputs.benchmark_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.benchmark_ref }}
          path: .benchmark-overlay

      - name: Install benchmark source overlay
        if: inputs.benchmark_ref != ''
        env:
          BENCH_NAME: ${{ inputs.bench }}
        run: |
          set -euo pipefail
          [[ "$BENCH_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
          cp ".benchmark-overlay/benches/${BENCH_NAME}.rs" "benches/${BENCH_NAME}.rs"
          if ! grep -Fq "name = \"${BENCH_NAME}\"" Cargo.toml; then
            printf '\n[[bench]]\nname = "%s"\npath = "benches/%s.rs"\nharness = false\n' \
              "$BENCH_NAME" "$BENCH_NAME" >> Cargo.toml
          fi

      - name: Update Rust to stable
        run: rustup update stable

      - name: Capture benchmark environment
        run: |
          rustc --version --verbose
          uname -a
          uptime

      - name: Run targeted benchmark
        run: cargo bench --locked --bench "$BENCH_NAME" -- --workload "${BENCH_NAME}::${WORKLOAD_NAME}" --samples '${{ inputs.samples }}' --warmup-samples '${{ inputs.warmup_samples }}' --no-progress --require-quiet-env

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier2-${{ inputs.workload }}-${{ inputs.source_ref || github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore
