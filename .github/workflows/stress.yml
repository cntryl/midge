name: Stress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"

jobs:
  stress:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust toolchain
        run: rustup update stable

      - name: Install Stress
        run: cargo install cntryl-stress

      - name: Run stress tests
        run: cargo stress -v > stress.log

      - name: Upload Criterion artifacts
        uses: actions/upload-artifact@v6
        with:
          name: stress-artifacts-${{ matrix.os }}
          path: stress.log
