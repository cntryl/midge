name: Benchmark Tier 1

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Measurement intensity (smoke, standard, extended)
        type: choice
        options: [smoke, standard, extended]
        default: standard

permissions:
  contents: read

concurrency:
  group: bench-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        bench:
          - tier1_hotpath_api
          - tier1_hotpath_bloom
          - tier1_hotpath_block_cache
          - tier1_hotpath_iterator
          - tier1_hotpath_memtable
          - tier1_hotpath_sst
          - tier1_hotpath_trie
          - tier1_hotpath_wal
          - tier1_hotpath_keyed_group_commit
          - tier1_hotpath_compression
          - tier1_hotpath_event_loop

    env:
      CARGO_INCREMENTAL: "0"
      # Use the harness defaults for each measurement intensity.
      STRESS_PROFILE: ${{ inputs.profile == 'smoke' && 'smoke' || inputs.profile == 'extended' && 'lab' || 'default' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Run benchmarks
        run: cargo bench --locked --bench '${{ matrix.bench }}'

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier1-${{ matrix.bench }}-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore
