name: Benchmark Tier 1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-tier1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update Rust to stable
        run: rustup update stable

      - name: Run registered Tier 1 targets
        shell: bash
        run: cargo bench --bench 'tier1_*'

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tier1-${{ github.sha }}
          path: |
            target/stress/**
            target/midge-stress/**
          if-no-files-found: ignore
